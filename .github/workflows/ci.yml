name: CI/CD

on:
  push:
    branches: [master, main, staging]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ── Lint & Type Check ───────────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ── Unit Tests ─────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      # These are TEST values — not real credentials
      NEXT_PUBLIC_SUPABASE_URL:      https://test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-xxxxxxxxxxxxxxxxxxxx
      SUPABASE_SERVICE_ROLE_KEY:     test-service-role-key-xxxxxxxxxxxxxxxxx
      OPENROUTER_API_KEY:            sk-or-test-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      APP_SECRET:                    test-app-secret-32-characters-long!!
      NEXT_PUBLIC_APP_URL:           http://localhost:3000
      WAHA_API_URL:                  http://localhost:3001
      WAHA_API_KEY:                  test-waha-key
      WAHA_WEBHOOK_SECRET:           test-webhook-secret
      WAHA_SESSION:                  default
      WAHA_SESSION_COMPANY_MAP:      '{"default":"00000000-0000-0000-0000-000000000001"}'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests (migration validation)
        run: npm run test:integration

  # ── Build Verification ─────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    env:
      NEXT_PUBLIC_SUPABASE_URL:      https://test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-xxxxxxxxxxxxxxxxxxxx
      SUPABASE_SERVICE_ROLE_KEY:     test-service-role-key-xxxxxxxxxxxxxxxxx
      OPENROUTER_API_KEY:            sk-or-test-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      APP_SECRET:                    test-app-secret-32-characters-long!!
      NEXT_PUBLIC_APP_URL:           https://example.com
      WAHA_API_URL:                  http://localhost:3001
      WAHA_API_KEY:                  test-waha-key
      WAHA_WEBHOOK_SECRET:           test-webhook-secret
      WAHA_SESSION:                  default
      WAHA_SESSION_COMPANY_MAP:      '{"default":"00000000-0000-0000-0000-000000000001"}'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check build output size
        run: |
          du -sh .next/ || true
          # Fail if standalone bundle > 100MB
          SIZE=$(du -sm .next/standalone 2>/dev/null | cut -f1 || echo 0)
          echo "Standalone bundle: ${SIZE}MB"
          if [ "$SIZE" -gt 100 ]; then
            echo "::warning::Bundle size ${SIZE}MB exceeds 100MB threshold"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: nextjs-build
          path: |
            .next/
            !.next/cache
          retention-days: 3

  # ── Environment Validation ─────────────────────────────────────────────
  validate-staging:
    name: Validate Staging Env
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment: staging
    env:
      NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
      OPENROUTER_API_KEY:            ${{ secrets.OPENROUTER_API_KEY }}
      APP_SECRET:                    ${{ secrets.APP_SECRET }}
      NEXT_PUBLIC_APP_URL:           ${{ secrets.STAGING_APP_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate environment
        run: node scripts/validate-env.js

  # ── Security Audit ────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check for secrets in code
        run: npm run security:secrets

      - name: Scan Git history for leaked secrets
        uses: gitleaks/gitleaks-action@v2
